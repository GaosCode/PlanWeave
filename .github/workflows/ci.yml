name: CI

on:
  push:
    paths-ignore:
      - "README.md"
      - "readme/**"
      - "DEVELOPMENT.md"
      - "CONTRIBUTING.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "readme/**"
      - "DEVELOPMENT.md"
      - "CONTRIBUTING.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Same-ref pushes (including main) keep the newest run; older ones are cancelled.
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      wsl: ${{ steps.filter.outputs.wsl }}
      server_host: ${{ steps.filter.outputs.server_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop:
              - ".github/workflows/ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "packages/desktop/**"
              - "packages/mcp/**"
              - "packages/runtime/**"
              - "scripts/sync-version-metadata.mjs"
            wsl:
              - ".github/workflows/ci.yml"
              - "packages/runtime/**"
            server_host:
              - ".github/workflows/ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "packages/agent-host/**"
              - "packages/agent-host-protocol/**"
              - "packages/collaboration-protocol/**"
              - "packages/runtime/**"
              - "packages/server/**"

  test-suite-classification:
    name: Test suite classification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check test suite classification
        run: node scripts/check-test-suite-classification.mjs

  node-22-13-compatibility:
    name: Node.js 22.13 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Verify Node.js version
        run: |
          node --version
          npm --version
          node -e 'if (process.versions.node !== "22.13.0") throw new Error("expected Node.js 22.13.0, got " + process.version)'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: >-
          pnpm
          --filter @planweave-ai/agent-host-protocol
          --filter @planweave-ai/collaboration-protocol
          --filter @planweave-ai/runtime
          --filter @planweave-ai/mcp
          --filter @planweave-ai/cli
          --filter @planweave-ai/server
          --filter @planweave-ai/agent-host
          build

      - name: Typecheck public packages
        run: >-
          pnpm
          --filter @planweave-ai/agent-host-protocol
          --filter @planweave-ai/collaboration-protocol
          --filter @planweave-ai/runtime
          --filter @planweave-ai/mcp
          --filter @planweave-ai/cli
          --filter @planweave-ai/server
          --filter @planweave-ai/agent-host
          typecheck

      - name: Audit installed distributed tarballs
        run: node scripts/distributed-package-install-smoke.mjs --skip-build

  ubuntu-gate:
    name: Ubuntu build, lint, and unit tests
    needs: test-suite-classification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit the production dependency graph at the high/critical threshold. Do not
      # ignore package-manager failures: registry transport and audit-parser errors must
      # fail this gate instead of being reported as a clean audit.
      - name: Audit dependencies (high/critical)
        run: npx --yes pnpm@11.4.0 audit --prod --audit-level=high

      # cli/desktop/mcp resolve @planweave-ai/runtime (and desktop also mcp) from
      # package exports that point at dist/. The root build prepares shared
      # dependencies once, then builds CLI and Desktop in parallel.
      - name: Build packages
        run: pnpm build

      - name: Audit installed distributed tarballs
        run: node scripts/distributed-package-install-smoke.mjs --skip-build

      # Distinct from typecheck so style/format failures are easy to spot in CI logs.
      - name: Biome check
        run: pnpm biome:check

      - name: Lint and typecheck
        run: pnpm lint

      - name: Create test report directory
        run: node -e "require('node:fs').mkdirSync('reports',{recursive:true})"

      - name: Run unit tests
        id: unit-tests
        timeout-minutes: 20
        run: pnpm test:unit --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml

      - name: Report slowest unit tests
        if: always() && steps.unit-tests.outcome != 'skipped'
        run: node scripts/report-slowest-tests.mjs reports/unit.xml "Unit tests" "${{ steps.unit-tests.outcome }}"

      - name: Redact failed Ubuntu test reports
        id: redact-unit
        if: always() && steps.unit-tests.outcome == 'failure'
        run: node scripts/redact-ci-test-artifacts.mjs reports

      - name: Upload failed Ubuntu test reports
        if: always() && steps.unit-tests.outcome == 'failure' && steps.redact-unit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ubuntu
          path: reports
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    name: Integration tests (${{ matrix.label }})
    needs:
      - test-suite-classification
      - changes
    if: ${{ matrix.shard != 'distributed' || needs.changes.outputs.server_host == 'true' }}
    runs-on: ubuntu-latest
    # Distributed realProcess suites need more wall time and serial workers than CLI/core shards.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            label: CLI
            job_timeout_minutes: 25
            test_timeout_minutes: 15
            max_workers: 2
          - shard: core
            label: Runtime, Desktop, and MCP
            job_timeout_minutes: 25
            test_timeout_minutes: 15
            max_workers: 2
          - shard: distributed
            label: Server and Agent Host
            job_timeout_minutes: 40
            test_timeout_minutes: 30
            # realProcess multi-process suites allocate loopback ports and long-lived
            # Server/Host trees; serial workers avoid port/process thrash under CI load.
            max_workers: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        timeout-minutes: 15
        run: pnpm build

      - name: Create test report directory
        run: node -e "require('node:fs').mkdirSync('reports',{recursive:true})"

      - name: Run integration tests
        id: integration-tests
        timeout-minutes: ${{ matrix.test_timeout_minutes }}
        run: pnpm test:integration:${{ matrix.shard }} --maxWorkers=${{ matrix.max_workers }} --reporter=default --reporter=junit --outputFile.junit=reports/integration-${{ matrix.shard }}.xml

      - name: Report slowest integration tests
        if: always() && steps.integration-tests.outcome != 'skipped'
        run: node scripts/report-slowest-tests.mjs reports/integration-${{ matrix.shard }}.xml "Integration (${{ matrix.label }})" "${{ steps.integration-tests.outcome }}"

      - name: Redact failed integration test report
        id: redact-integration
        if: always() && steps.integration-tests.outcome == 'failure'
        run: node scripts/redact-ci-test-artifacts.mjs reports

      - name: Upload failed integration test report
        if: always() && steps.integration-tests.outcome == 'failure' && steps.redact-integration.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 7

  performance-tests:
    name: Block Run Index performance regression
    needs: test-suite-classification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        timeout-minutes: 15
        run: pnpm build

      - name: Create test report directory
        run: node -e "require('node:fs').mkdirSync('reports',{recursive:true})"

      - name: Run performance regression
        id: performance-tests
        timeout-minutes: 10
        run: pnpm test:performance --maxWorkers=1 --reporter=default --reporter=junit --outputFile.junit=reports/performance.xml

      - name: Report slowest performance tests
        if: always() && steps.performance-tests.outcome != 'skipped'
        run: node scripts/report-slowest-tests.mjs reports/performance.xml "Performance regression" "${{ steps.performance-tests.outcome }}"

      - name: Redact failed performance test report
        id: redact-performance
        if: always() && steps.performance-tests.outcome == 'failure'
        run: node scripts/redact-ci-test-artifacts.mjs reports

      - name: Upload failed performance test report
        if: always() && steps.performance-tests.outcome == 'failure' && steps.redact-performance.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-report
          path: reports
          if-no-files-found: error
          retention-days: 7

  platform-tests:
    name: Platform tests (${{ matrix.os }})
    needs: test-suite-classification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create test report directory
        run: node -e "require('node:fs').mkdirSync('reports',{recursive:true})"

      - name: Run platform tests
        id: platform-tests
        timeout-minutes: 20
        run: pnpm test:platform --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=reports/platform.xml

      - name: Report slowest platform tests
        if: always() && steps.platform-tests.outcome != 'skipped'
        run: node scripts/report-slowest-tests.mjs reports/platform.xml "Platform (${{ matrix.os }})" "${{ steps.platform-tests.outcome }}"

      - name: Redact failed platform test report
        id: redact-platform
        if: always() && steps.platform-tests.outcome == 'failure'
        run: node scripts/redact-ci-test-artifacts.mjs reports

      - name: Upload failed platform test report
        if: always() && steps.platform-tests.outcome == 'failure' && steps.redact-platform.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-report-${{ matrix.os }}
          path: reports
          if-no-files-found: error
          retention-days: 7

  windows-wsl-integration:
    name: Windows WSL execution-host integration
    needs:
      - test-suite-classification
      - changes
    if: ${{ needs.changes.outputs.wsl == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PLANWEAVE_REQUIRE_WSL_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Ubuntu WSL 1
        shell: pwsh
        run: |
          function Invoke-WslCommand {
            param(
              [Parameter(Mandatory)][string[]]$Arguments,
              [Parameter(Mandatory)][Text.Encoding]$OutputEncoding
            )

            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = "wsl.exe"
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardOutputEncoding = $OutputEncoding
            $startInfo.StandardErrorEncoding = $OutputEncoding
            foreach ($argument in $Arguments) {
              [void]$startInfo.ArgumentList.Add($argument)
            }

            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) { throw "Failed to start wsl.exe." }
            $outputTask = $process.StandardOutput.ReadToEndAsync()
            $errorTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            [pscustomobject]@{
              ExitCode = $process.ExitCode
              Output = $outputTask.GetAwaiter().GetResult()
              ErrorOutput = $errorTask.GetAwaiter().GetResult()
            }
          }

          function Get-WslFailureSummary {
            param([Parameter(Mandatory)]$Result)

            $summary = $Result.ErrorOutput.Trim()
            if (-not $summary) { return "wsl.exe exited with code $($Result.ExitCode)." }
            $summary = $summary -replace '(?i)\b(password|secret|token|key)=[^\s]+', '$1=[REDACTED]'
            if ($summary.Length -gt 500) { $summary = "$($summary.Substring(0, 500))…" }
            return $summary
          }

          $managementEncoding = [Text.Encoding]::Unicode
          $setDefaultVersion = Invoke-WslCommand -Arguments @("--set-default-version", "1") -OutputEncoding $managementEncoding
          if ($setDefaultVersion.ExitCode -ne 0) { throw "Failed to set the default WSL version to 1: $(Get-WslFailureSummary $setDefaultVersion)" }

          $installed = Invoke-WslCommand -Arguments @("--list", "--quiet") -OutputEncoding $managementEncoding
          if ($installed.ExitCode -ne 0) { throw "Failed to list installed WSL distributions: $(Get-WslFailureSummary $installed)" }

          if (-not (($installed.Output -split "\r?\n" | ForEach-Object { $_.Trim() }) -contains "Ubuntu")) {
            $installUbuntu = Invoke-WslCommand -Arguments @("--install", "--distribution", "Ubuntu", "--version", "1", "--no-launch", "--web-download") -OutputEncoding $managementEncoding
            if ($installUbuntu.ExitCode -ne 0) {
              throw "Failed to install the Ubuntu WSL distribution: $(Get-WslFailureSummary $installUbuntu)"
            }
          }

          $verbose = Invoke-WslCommand -Arguments @("--list", "--verbose") -OutputEncoding $managementEncoding
          if ($verbose.ExitCode -ne 0) { throw "Failed to inspect the Ubuntu WSL version: $(Get-WslFailureSummary $verbose)" }
          if (-not ($verbose.Output -match "(?m)^\s*\*?\s*Ubuntu\s+\S+\s+1\s*$")) {
            throw "Ubuntu is not installed as a WSL 1 distribution."
          }

          $env:WSLENV = "PLANWEAVE_WSL_CI_SENTINEL"
          $env:PLANWEAVE_WSL_CI_SENTINEL = "planweave-wsl-ci"
          $probeScript = 'test "$WSL_DISTRO_NAME" = "Ubuntu" && test "$PLANWEAVE_WSL_CI_SENTINEL" = "planweave-wsl-ci" && printf "%s\n" "$WSL_DISTRO_NAME"'
          $probe = Invoke-WslCommand -Arguments @("--distribution", "Ubuntu", "--exec", "sh", "-lc", $probeScript) -OutputEncoding ([Text.Encoding]::UTF8)
          if ($probe.ExitCode -ne 0) { throw "Ubuntu WSL execution probe failed: $(Get-WslFailureSummary $probe)" }
          if ($probe.Output.Trim() -ne "Ubuntu") { throw "Ubuntu WSL execution probe returned an unexpected distribution." }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol packages
        run: pnpm --filter @planweave-ai/agent-host-protocol build && pnpm --filter @planweave-ai/collaboration-protocol build

      - name: Run WSL execution-host integration test
        timeout-minutes: 10
        run: pnpm exec vitest run packages/runtime/src/__tests__/executorEnvironment.test.ts --config vitest.integration-core.config.ts --testNamePattern="does not import a sentinel Windows credential named by WSLENV"

      - name: Run WSL cancellation lifecycle integration test
        timeout-minutes: 10
        run: pnpm exec vitest run packages/runtime/src/__tests__/executorEnvironment.test.ts --config vitest.integration-core.config.ts --testNamePattern="cancels a WSL execution and finalizes executor lifecycle"

      - name: Stop Ubuntu WSL
        if: always()
        shell: pwsh
        run: |
          wsl.exe --terminate Ubuntu
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stop the Ubuntu WSL distribution."
          }

  windows-packaged-smoke:
    name: Windows unsigned packaged smoke
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop
        timeout-minutes: 15
        run: pnpm --dir packages/desktop build

      - name: Package unsigned Windows app
        timeout-minutes: 20
        run: pnpm --dir packages/desktop pack:win

      - name: Run packaged Windows startup smoke
        timeout-minutes: 5
        env:
          PLANWEAVE_PACKAGED_PLATFORM: win32
          PLANWEAVE_CI_REPORT_PATH: reports/windows-packaged-smoke.json
        run: pnpm --dir packages/desktop smoke:packaged:win

      - name: Ensure packaged smoke failure report exists
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          if (-not (Test-Path reports/windows-packaged-smoke.json)) {
            '{"schemaVersion":1,"platform":"win32","status":"failed","failedStage":"build-or-package"}' | Set-Content reports/windows-packaged-smoke.json
          }

      - name: Redact packaged smoke failure report
        id: redact-packaged-smoke
        if: failure()
        run: node scripts/redact-ci-test-artifacts.mjs reports

      - name: Upload packaged smoke failure report
        if: failure() && steps.redact-packaged-smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-smoke-report
          path: reports
          if-no-files-found: error
          retention-days: 7
